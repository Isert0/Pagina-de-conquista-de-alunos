<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conquistas dos Alunos</title>
    <link rel="stylesheet" href="styles_aluno.css">
</head>
<body>
    <header class="profile-header">
        <img src="Aluno.png" alt="Foto de perfil" class="profile-pic">
        <div class="profile-info">
            <h1>Ana Clara 2</h1>
            <p class="status">Frequente</p>
        </div>
    </header>
    
    <nav class="tabs">
        <button class="tab active">Conquistas</button>
        <button class="tab">Postagens</button>
        <button class="tab">Sobre</button>
    </nav>

    <main class="content">
        <section class="rank">
            <h2>Sua Classificação no nivelamento</h2>
            <div class="rank-info">
                <span>#14 / 289</span>
                <span>+ 715 pontos</span>
            </div>
        </section>

        <section class="achievements">
            <div class="achievement">
                <img src="pincel.jpg" alt="pincel" class="achievement-img">
                <div class="achievement-info">
                    <h3>Heureca</h3>
                    <p>Fui no quadro responder a questão</p>
                    <p>16 troféus - 13% concluído</p>
                </div>
            </div>

            <div class="achievement">
                <img src="Heureca.jpeg" alt="Heureca" class="achievement-img">
                <div class="achievement-info">
                    <h3>Mapa encontrado</h3>
                    <p>Participe da caçada aos eggs</p>
                    <p>9 troféus - 47% concluído</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
