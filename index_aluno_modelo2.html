<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Aluno</title>
  <link rel="stylesheet" href="styles_aluno_modelo2.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="profile-pic"></div>
      <div class="student-info">
        <h1>Nome do Aluno</h1>
        <p>Curso</p>
        <p>Rank</p>
        <p>ID</p>
      </div>
    </div>

    <div class="content">
      <div class="section conquistas">
        <h2>Conquistas</h2>
        <div class="achievement">
          <div class="achievement-icon"></div>
          <div class="achievement-info">
            <h3>Heureca</h3>
            <p>+15</p>
            <p>Ir no quadro resolver um problema</p>
          </div>
        </div>
        <div class="achievement">
          <div class="achievement-icon-heureca"></div>
          <div class="achievement-info">
            <h3>Mapa do Tesouro</h3>
            <p>+25</p>
            <p>Participou da caçada aos eggs</p>
          </div>
        </div>
      </div>

      <div class="section frequencia">
        <h2>Frequência</h2>
        <div class="achievement">
          <div class="achievement-icon"></div>
          <div class="achievement-info">
            <h3>Heureca</h3>
            <p>+15</p>
            <p>Ir no quadro resolver um problema</p>
          </div>
        </div>
        <div class="achievement">
          <div class="achievement-icon-quadro"></div>
          <div class="achievement-info">
            <h3>Mapa do Tesouro</h3>
            <p>+25</p>
            <p>Participou da caçada aos eggs</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
